version = 1

[*]
mmproj = models/mmproj-F16.gguf
image-min-tokens = 1024
n-gpu-layers = all
flash-attn = on
ctx-size = 245760
parallel = 1
batch-size = 2048
ubatch-size = 2048
cache-type-k = q8_0
cache-type-v = q8_0
threads = 16
threads-batch = 16
spec-draft-model = models/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
spec-type = draft-dflash
spec-draft-n-max = 4
spec-draft-n-min = 0
spec-draft-ngl = all
jinja = true
reasoning = auto
reasoning-preserve = true
reasoning-format = deepseek
stop-timeout = 45

[qwen3.8-27b-q4-fast]
model = models/Qwen3.8-27B-UD-Q4_K_XL.gguf
load-on-startup = true

[qwen3.8-27b-q5-quality]
model = models/Qwen3.8-27B-UD-Q5_K_XL.gguf
load-on-startup = false
